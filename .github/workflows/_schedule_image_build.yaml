name: Build Selected Test Image

on:
  workflow_call:
    inputs:
      device:
        description: 'Ascend device Dockerfile variant'
        required: true
        type: string
      os:
        description: 'Base operating system'
        required: true
        type: string
      soc:
        description: 'Ascend SoC type (e.g. 910b, a3, 310p, 950)'
        required: true
        type: string
      release_tag:
        description: 'Image tag prefix; device and OS are appended automatically'
        required: true
        type: string
      source_ref:
        description: 'Branch or ref of vllm-ascend-day0 to build'
        required: true
        type: string
      quay_username:
        description: 'Quay username for pushing the image'
        required: true
        type: string
      atlas_quay_username:
        description: 'Quay username for pushing the intermediate image'
        required: true
        type: string
      arch:
        description: 'Architecture to build: both / amd64 / arm64'
        required: true
        type: string
    secrets:
      QUAY_TOKEN:
        description: 'Quay token for pushing the image'
        required: true
      QUAY_ATLAS_TOKEN:
        description: 'Quay token for pushing the intermediate image to the temporary repository'
        required: true

env:
  IMAGE_REPO: quay.io/ascend/vllm-ascend
  TEMP_IMAGE_REPO: quay.io/atlas-ci/vllm-atlas-temp

jobs:

  prepare-arch-matrix:
    name: Prepare architecture matrix
    runs-on: linux-amd64-cpu-4
    outputs:
      arch_matrix: ${{ steps.arch-matrix.outputs.arch_matrix }}
    steps:
      - name: Compute architecture matrix
        id: arch-matrix
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) archs='[{"platform":"linux/amd64","runner":"linux-amd64-cpu-4","arch_tag":"amd64"}]' ;;
            arm64) archs='[{"platform":"linux/arm64","runner":"linux-aarch64-cpu-4","arch_tag":"arm64"}]' ;;
            both)  archs='[{"platform":"linux/amd64","runner":"linux-amd64-cpu-4","arch_tag":"amd64"},{"platform":"linux/arm64","runner":"linux-aarch64-cpu-4","arch_tag":"arm64"}]' ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          echo "arch_matrix=$archs" >> "$GITHUB_OUTPUT"
          echo "Computed architecture matrix: $archs"

  build-push-digest:

    name: Build ${{ matrix.arch_tag }}
    needs: prepare-arch-matrix
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-${{ inputs.soc }}-ubuntu22.04-py3.12
    #   image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-arch-matrix.outputs.arch_matrix) }}

    steps:
      - name: Pre-config git access token
        run: |
          # as we use a proxy but actions/checkout only set basic auth header for github.com
          # so we set the extraheader manually
          rm -fr /etc/gitconfig ~/.gitconfig
          # TOKEN=`echo -n "x-access-token:${{ secrets.GITHUB_TOKEN}}"|base64`
          # git config --global http.https://gh-proxy.test.osinfra.cn/.extraheader "AUTHORIZATION: basic $TOKEN" 

          # TOKEN=`echo -n "x-access-token:${{ secrets.GITHUB_TOKEN}}"|base64 -w 0`
          # git config --global url."http://x-access-token:${{ secrets.GITHUB_TOKEN}}@git-cdn-service.git-cdn.svc.cluster.local:8000/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN}}@gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"

      - name: Checkout vllm-ascend-day0
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Resolve and validate Dockerfile
        id: dockerfile
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
          BASE_OS: ${{ inputs.os }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          case "$DEVICE" in
            910b) dockerfile="Dockerfile" ;;
            a3|a5|310p) dockerfile="Dockerfile.${DEVICE}" ;;
            *) echo "Unsupported device: $DEVICE" >&2; exit 1 ;;
          esac

          case "$BASE_OS" in
            ubuntu) ;;
            openeuler) dockerfile="${dockerfile}.openEuler" ;;
            *) echo "Unsupported operating system: $BASE_OS" >&2; exit 1 ;;
          esac

          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$ ]]; then
            echo "Invalid release tag prefix: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! -f "$dockerfile" ]]; then
            echo "Dockerfile does not exist: $dockerfile" >&2
            exit 1
          fi

          echo "path=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "Selected Dockerfile: $dockerfile"

      # - name: Free up disk space
      #   uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      #   with:
      #     tool-cache: true
      #     docker-images: false

      - name: Get architecture
        id: get_arch
        shell: bash
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) echo "arch=X64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "arch=ARM64" >> "$GITHUB_OUTPUT" ;;
            *) echo "arch=$ARCH" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Get Dockerfile base image tag
        id: get_base_image_tag
        shell: bash
        run: |
          DOCKERFILE="${{ steps.dockerfile.outputs.path }}"
          BASE_IMAGE_TAG=$(grep -m1 '^FROM' "$DOCKERFILE" | awk -F: '{print $NF}')
          echo "BASE_IMAGE_TAG=$BASE_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Get csrc hash
        id: get_csrc_hash
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          CSRC_MANIFEST=$(git ls-files -s -- csrc setup.py CMakeLists.txt cmake)
          if [ -z "$CSRC_MANIFEST" ]; then
            echo "::error::No tracked csrc inputs found."
            exit 1
          fi

          CSRC_HASH=$(printf '%s\n' "$CSRC_MANIFEST" | sha256sum | awk '{print $1}')
          echo "CSRC_HASH=$CSRC_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore vllm-ascend csrc cache
        id: cache-csrc
        uses: runs-on/cache/restore@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v2-${{ steps.get_arch.outputs.arch }}-${{ inputs.soc }}-${{ steps.get_base_image_tag.outputs.BASE_IMAGE_TAG }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}

      - name: Login to Quay (atlas-ci)
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ inputs.atlas_quay_username }}
          password: ${{ secrets.QUAY_ATLAS_TOKEN }}

      - name: Resolve push target
        id: push-target
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
          BASE_OS: ${{ inputs.os }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCH_TAG: ${{ matrix.arch_tag }}
        run: |
          set -euo pipefail

          temp_tag="${RELEASE_TAG}-${DEVICE}-${BASE_OS}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH_TAG}-temp"
          echo "build_output=type=image,name=${TEMP_IMAGE_REPO}:${temp_tag},push=true" >> "$GITHUB_OUTPUT"

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v4
      #   with:
      #     driver: docker-container
      #     use: true

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: ${{ steps.push-target.outputs.build_output }}
          build-args: |            
            CANN_QUAY_URL=swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann
            APTMIRROR=http://cache-service.nginx-pypi-cache.svc.cluster.local:8081
            PIP_INDEX_URL=http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
            PIP_TRUSTED_HOST=cache-service.nginx-pypi-cache.svc.cluster.local
            PYTORCH_INDEX_URL=http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu
            ASCEND_INDEX_URL=http://cache-service.nginx-pypi-cache.svc.cluster.local/ascend/repos/pypi
            GIT_PROXY=https://gh-proxy.test.osinfra.cn/
            COMPILE_CUSTOM_KERNELS=${{ steps.cache-csrc.outputs.cache-hit == 'true' && '0' || '1' }}
          provenance: false

      - name: Save vllm-ascend csrc cache
        if: ${{ steps.cache-csrc.outputs.cache-hit != 'true' && !cancelled() }}
        uses: runs-on/cache/save@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v2-${{ steps.get_arch.outputs.arch }}-${{ inputs.soc }}-${{ steps.get_base_image_tag.outputs.BASE_IMAGE_TAG }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}
